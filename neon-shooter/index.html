<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070916"><title>NEON RUSH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050713;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.hud{display:flex;justify-content:space-between;padding:18px;font-weight:800;text-shadow:0 2px 8px #000}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}.card{width:min(88vw,420px);padding:30px;text-align:center;border:1px solid #35f3ff55;border-radius:24px;background:#090d20e8;box-shadow:0 0 50px #19d8ff22}.logo{font-size:42px;font-weight:1000;letter-spacing:3px}.sub{opacity:.72;line-height:1.6;margin:12px 0 22px}button{border:0;border-radius:999px;padding:15px 34px;font-size:18px;font-weight:900;background:#48f5ff;color:#071018;box-shadow:0 0 24px #48f5ff77}.hidden{display:none}.combo{position:absolute;top:55px;width:100%;text-align:center;font-size:18px;font-weight:900;color:#ffdc57}.hint{font-size:12px;opacity:.55;margin-top:16px}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><div class="combo" id="combo"></div><div class="center" id="menu"><div class="card"><div class="logo">NEON RUSH</div><div class="sub">指1本で避けて、撃ちまくる。<br>敵を連続撃破してコンボを伸ばせ。</div><button id="start">START</button><div class="hint">ドラッグで移動・ショットは自動</div></div></div><div class="center hidden" id="over"><div class="card"><div class="logo">GAME OVER</div><div class="sub">SCORE <b id="final">0</b><br>BEST <b id="best2">0</b></div><button id="retry">RETRY</button></div></div></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,dpr,playing=false,last=0,spawn=0,shot=0,score=0,combo=0,comboT=0,shake=0;let best=+localStorage.neonBest||0;bestEl=document.querySelector('#best');bestEl.textContent=best;let p={x:0,y:0,r:13},bul=[],ene=[],fx=[],stars=[];
function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!p.x){p.x=W/2;p.y=H*.8}stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1}))}addEventListener('resize',resize);resize();
function reset(){score=combo=comboT=0;bul=[];ene=[];fx=[];p.x=W/2;p.y=H*.82;playing=true;last=performance.now();document.querySelector('#menu').classList.add('hidden');document.querySelector('#over').classList.add('hidden');requestAnimationFrame(loop)}
function boom(o,col='#ff4d8d'){for(let i=0;i<10;i++){let a=Math.random()*6.28,v=Math.random()*3+1;fx.push({x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,col})}}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/16.67,2);last=t;spawn+=dt;shot+=dt;comboT-=dt; if(comboT<=0)combo=0;let level=1+score/500;
if(spawn>Math.max(12,38-level*2)){spawn=0;let r=10+Math.random()*10;ene.push({x:r+Math.random()*(W-r*2),y:-25,r,vy:1.7+Math.random()*1.3+level*.12,hp:r>16?2:1,w:Math.random()*2-.5})}
if(shot>8){shot=0;bul.push({x:p.x,y:p.y-18,r:4,vy:-9})}
bul.forEach(b=>b.y+=b.vy*dt);ene.forEach(e=>{e.y+=e.vy*dt;e.x+=Math.sin(e.y*.025)*e.w*dt});fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=.04*dt});stars.forEach(s=>{s.y+=s.s*.45*dt;if(s.y>H)s.y=0});
for(let i=ene.length-1;i>=0;i--){let e=ene[i];if(hit(e,p)||e.y>H+30){boom(p,'#48f5ff');end();return}for(let j=bul.length-1;j>=0;j--)if(hit(e,bul[j])){bul.splice(j,1);e.hp--;boom({x:e.x,y:e.y},'#ffd85a');if(e.hp<=0){ene.splice(i,1);combo++;comboT=70;score+=10+Math.min(combo,20)*2;shake=5;boom(e);if(navigator.vibrate)navigator.vibrate(8)}break}}
bul=bul.filter(b=>b.y>-20);fx=fx.filter(f=>f.l>0);document.querySelector('#score').textContent=score;document.querySelector('#combo').textContent=combo>=3?'×'+combo+' COMBO':'';draw();requestAnimationFrame(loop)}
function draw(){x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8}let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080b1d');g.addColorStop(1,'#12051b');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#7cecff';stars.forEach(s=>{x.globalAlpha=.25+s.s*.12;x.fillRect(s.x,s.y,s.s,s.s)});x.globalAlpha=1;bul.forEach(b=>{x.shadowBlur=18;x.shadowColor='#48f5ff';x.fillStyle='#b9fbff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()});ene.forEach(e=>{x.shadowBlur=22;x.shadowColor='#ff3c83';x.strokeStyle='#ff5b96';x.lineWidth=3;x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.stroke();x.fillStyle='#ff3c8330';x.fill()});x.shadowBlur=25;x.shadowColor='#48f5ff';x.fillStyle='#62f6ff';x.beginPath();x.moveTo(p.x,p.y-17);x.lineTo(p.x-12,p.y+14);x.lineTo(p.x,p.y+8);x.lineTo(p.x+12,p.y+14);x.closePath();x.fill();fx.forEach(f=>{x.globalAlpha=f.l;x.fillStyle=f.col;x.fillRect(f.x,f.y,3,3)});x.restore()}
function end(){playing=false;best=Math.max(best,score);localStorage.neonBest=best;bestEl.textContent=best;document.querySelector('#final').textContent=score;document.querySelector('#best2').textContent=best;document.querySelector('#over').classList.remove('hidden')}
function move(e){if(!playing)return;let q=e.touches?e.touches[0]:e;p.x=Math.max(18,Math.min(W-18,q.clientX));p.y=Math.max(H*.25,Math.min(H-25,q.clientY))}addEventListener('pointermove',move);addEventListener('touchmove',move,{passive:false});document.querySelector('#start').onclick=reset;document.querySelector('#retry').onclick=reset;draw();
</script></body></html>
