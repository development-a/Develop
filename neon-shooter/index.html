<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON RUSH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050713;color:#fff;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;padding:14px;font-weight:900;pointer-events:none}.bar{position:fixed;top:46px;left:15%;width:70%;height:7px;background:#ffffff18;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#55efff;width:0}.center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05071399}.hidden{display:none}.card{width:min(90vw,430px);padding:27px;text-align:center;border:1px solid #42edff55;border-radius:24px;background:#090d20f2;box-shadow:0 0 50px #1ee8ff22}.logo{font-size:38px;font-weight:1000}.sub{opacity:.7;margin:12px 0 20px;line-height:1.6}button{width:100%;margin:6px 0;border:0;border-radius:15px;padding:15px;font-weight:900;font-size:16px;background:#55efff;color:#071018}.upgrade button{text-align:left}.boss{position:fixed;top:67px;left:15%;width:70%;text-align:center;font-size:12px;font-weight:900}.bossbar{height:8px;background:#ffffff20;border-radius:8px;overflow:hidden}.bossbar i{display:block;height:100%;background:#ff477f}</style></head><body><canvas id="c"></canvas><div class="hud"><span>SCORE <b id="sc">0</b>　LV <b id="lv">1</b></span><span>BEST <b id="best">0</b></span></div><div class="bar"><i id="xpbar"></i></div><div class="boss hidden" id="bossui">BOSS<div class="bossbar"><i id="bossbar"></i></div></div><div class="center" id="menu"><div class="card"><div class="logo">NEON RUSH</div><div class="sub">倒す。拾う。強くなる。<br>5レベルごとにボス襲来。</div><button onclick="reset()">START</button></div></div><div class="center hidden" id="up"><div class="card upgrade"><div class="logo">LEVEL UP!</div><div class="sub">強化を1つ選択</div><div id="choices"></div></div></div><div class="center hidden" id="over"><div class="card"><div class="logo">GAME OVER</div><div class="sub">SCORE <b id="final"></b></div><button onclick="reset()">RETRY</button></div></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D,last,run=false,score=0,level=1,xp=0,need=100,spawn=0,shot=0,boss=null,bossDone=0;let best=+localStorage.neonBest||0;document.querySelector('#best').textContent=best;let p={x:0,y:0,r:13,rate:8,dmg:1,multi:1,shield:0},bs=[],es=[],items=[],fx=[],stars=[];
function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1}));if(!p.x){p.x=W/2;p.y=H*.82}}onresize=resize;resize();
function reset(){score=0;level=1;xp=0;need=100;spawn=shot=bossDone=0;boss=null;bs=[];es=[];items=[];p={x:W/2,y:H*.82,r:13,rate:8,dmg:1,multi:1,shield:0};run=true;last=performance.now();menu.classList.add('hidden');over.classList.add('hidden');up.classList.add('hidden');requestAnimationFrame(loop)}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}function boom(o,col='#ff4d8d'){for(let i=0;i<8;i++){let a=Math.random()*6.28,v=Math.random()*3;fx.push({x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,col})}}
function addXP(n){xp+=n;if(xp>=need){xp-=need;level++;need=Math.floor(need*1.22);showUpgrade()}hud()}
const upgrades=[['RAPID FIRE','射撃速度 +18%',()=>p.rate=Math.max(2.8,p.rate*.82)],['POWER','弾丸ダメージ +1',()=>p.dmg++],['MULTI SHOT','同時発射 +1',()=>p.multi=Math.min(5,p.multi+1)],['SHIELD','1回だけ被弾を無効化',()=>p.shield++],['MAGNET','アイテム取得範囲UP',()=>p.r+=2]];
function showUpgrade(){run=false;up.classList.remove('hidden');let a=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);choices.innerHTML='';a.forEach(v=>{let b=document.createElement('button');b.innerHTML='<b>'+v[0]+'</b><br><small>'+v[1]+'</small>';b.onclick=()=>{v[2]();up.classList.add('hidden');run=true;last=performance.now();if(level%5===0&&bossDone<level)makeBoss();requestAnimationFrame(loop)};choices.appendChild(b)})}
function makeBoss(){bossDone=level;es=[];boss={x:W/2,y:110,r:45,hp:50+level*12,max:50+level*12,t:0};bossui.classList.remove('hidden')}
function drop(e){if(Math.random()<.16)items.push({x:e.x,y:e.y,r:10,vy:1.5,type:Math.random()<.55?'coin':Math.random()<.75?'rapid':'shield'})}
function hud(){sc.textContent=score;lv.textContent=level;xpbar.style.width=(xp/need*100)+'%';if(boss){bossbar.style.width=Math.max(0,boss.hp/boss.max*100)+'%'}}
function loop(t){if(!run)return;let dt=Math.min((t-last)/16.7,2);last=t;spawn+=dt;shot+=dt;if(!boss&&spawn>Math.max(12,35-level*.8)){spawn=0;let r=11+Math.random()*10;es.push({x:20+Math.random()*(W-40),y:-25,r,vy:1.5+Math.random()*1.6+level*.05,hp:r>17?3:1})}if(shot>p.rate){shot=0;for(let i=0;i<p.multi;i++){let spread=(i-(p.multi-1)/2)*.12;bs.push({x:p.x,y:p.y-18,r:4,vx:Math.sin(spread)*9,vy:-Math.cos(spread)*9,d:p.dmg})}}
if(boss){boss.t+=dt;boss.x=W/2+Math.sin(boss.t*.025)*(W*.3);if(Math.floor(boss.t)%55===0)es.push({x:boss.x,y:boss.y+35,r:12,vy:4,hp:2,bossShot:true})}bs.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});es.forEach(e=>e.y+=e.vy*dt);items.forEach(i=>i.y+=i.vy*dt);fx.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.l-=.04});stars.forEach(s=>{s.y+=s.s*.4;if(s.y>H)s.y=0});
for(let i=es.length-1;i>=0;i--){let e=es[i];if(hit(e,p)||e.y>H+20){if(hit(e,p)&&p.shield){p.shield--;es.splice(i,1);boom(p,'#55efff');continue}end();return}for(let j=bs.length-1;j>=0;j--)if(hit(e,bs[j])){e.hp-=bs[j].d;bs.splice(j,1);if(e.hp<=0){es.splice(i,1);score+=e.bossShot?5:15;addXP(e.bossShot?2:18);if(!e.bossShot)drop(e);boom(e)}break}}
if(boss)for(let j=bs.length-1;j>=0;j--)if(hit(boss,bs[j])){boss.hp-=bs[j].d;bs.splice(j,1);boom({x:boss.x+(Math.random()-.5)*50,y:boss.y},'#ffd65a');if(boss.hp<=0){score+=500;addXP(100);boom(boss,'#fff');boss=null;bossui.classList.add('hidden');break}}
for(let i=items.length-1;i>=0;i--)if(hit({x:p.x,y:p.y,r:p.r+12},items[i])){let q=items[i];if(q.type==='coin'){score+=100;addXP(25)}if(q.type==='rapid')p.rate=Math.max(3,p.rate*.88);if(q.type==='shield')p.shield++;items.splice(i,1);boom(q,'#6cff8e')}
bs=bs.filter(b=>b.y>-30);items=items.filter(i=>i.y<H+20);fx=fx.filter(f=>f.l>0);hud();draw();requestAnimationFrame(loop)}
function draw(){let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#080b1d');q.addColorStop(1,'#16051d');g.fillStyle=q;g.fillRect(0,0,W,H);g.fillStyle='#8eefff';stars.forEach(s=>{g.globalAlpha=.25;g.fillRect(s.x,s.y,s.s,s.s)});g.globalAlpha=1;bs.forEach(b=>{g.fillStyle='#7ff7ff';g.shadowBlur=15;g.shadowColor='#55efff';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()});es.forEach(e=>{g.strokeStyle=e.bossShot?'#ffcc45':'#ff4b86';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.stroke()});if(boss){g.shadowBlur=30;g.shadowColor='#ff286f';g.fillStyle='#5b1230';g.beginPath();g.arc(boss.x,boss.y,boss.r,0,7);g.fill();g.strokeStyle='#ff477f';g.lineWidth=5;g.stroke()}items.forEach(i=>{g.shadowBlur=18;g.shadowColor=i.type==='coin'?'#ffd85a':'#63ffad';g.fillStyle=i.type==='coin'?'#ffd85a':i.type==='rapid'?'#63ffad':'#63aaff';g.beginPath();g.arc(i.x,i.y,i.r,0,7);g.fill()});g.shadowBlur=25;g.shadowColor='#55efff';g.fillStyle=p.shield?'#a5b8ff':'#62f6ff';g.beginPath();g.moveTo(p.x,p.y-17);g.lineTo(p.x-12,p.y+14);g.lineTo(p.x,p.y+8);g.lineTo(p.x+12,p.y+14);g.fill();fx.forEach(f=>{g.globalAlpha=f.l;g.fillStyle=f.col;g.fillRect(f.x,f.y,3,3)});g.globalAlpha=1;g.shadowBlur=0}
function end(){run=false;best=Math.max(best,score);localStorage.neonBest=best;document.querySelector('#best').textContent=best;final.textContent=score;bossui.classList.add('hidden');over.classList.remove('hidden')}
function move(e){if(!run)return;p.x=Math.max(18,Math.min(W-18,e.clientX));p.y=Math.max(H*.25,Math.min(H-22,e.clientY))}addEventListener('pointermove',move);hud();draw();</script></body></html>
