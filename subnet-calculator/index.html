<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subnet Calculator</title>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--card:#151a23;--line:#293140;--text:#f4f7fb;--muted:#9ba8ba;--accent:#6ea8fe;--good:#6ee7b7;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 40px}h1{font-size:27px;margin:8px 0 4px}.sub{color:var(--muted);margin:0 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #0004}.label{font-size:13px;color:var(--muted);margin-bottom:8px}.inputrow{display:flex;gap:8px}input{min-width:0;flex:1;background:#0d1118;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:15px;font-size:18px;outline:none}input:focus{border-color:var(--accent)}button{border:0;border-radius:13px;background:var(--accent);color:#07111f;font-weight:800;padding:0 18px;font-size:15px}.hint{font-size:12px;color:var(--muted);margin-top:9px}.error{color:var(--bad);font-size:13px;margin-top:10px;display:none}.grid{display:grid;grid-template-columns:1fr;gap:10px}.item{background:#0d1118;border:1px solid var(--line);border-radius:14px;padding:13px}.k{font-size:12px;color:var(--muted)}.v{font-size:17px;font-weight:750;margin-top:4px;word-break:break-all}.copy{cursor:pointer}.copy:active{transform:scale(.99)}.badge{display:inline-block;color:var(--good);font-size:12px;margin-left:6px}@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="wrap"><h1>Subnet Calculator</h1><p class="sub">IPv4 CIDRを入力するだけでサブネット情報を計算</p>
<section class="card"><div class="label">IPアドレス / CIDR</div><div class="inputrow"><input id="cidr" value="192.168.10.34/24" inputmode="decimal" autocomplete="off"><button id="calc">計算</button></div><div class="hint">例：192.168.10.34/24　※ /0〜/32対応</div><div id="err" class="error"></div></section>
<section class="card"><div class="grid" id="results"></div></section></main>
<script>
const $=id=>document.getElementById(id);const ipToNum=ip=>ip.split('.').reduce((a,v)=>(a*256+(+v))>>>0,0);const numToIp=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
function validIp(ip){const p=ip.split('.');return p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&+x>=0&&+x<=255)}
function calculate(){const raw=$('cidr').value.trim().replace(/\s/g,'');const m=raw.match(/^([^/]+)\/(\d{1,2})$/);const err=$('err');err.style.display='none';if(!m||!validIp(m[1])||+m[2]>32){err.textContent='正しい形式で入力してください（例：192.168.10.34/24）';err.style.display='block';return}const ip=m[1],prefix=+m[2],n=ipToNum(ip);const mask=prefix===0?0:(0xffffffff<<(32-prefix))>>>0;const wildcard=(~mask)>>>0;const network=(n&mask)>>>0;const broadcast=(network|wildcard)>>>0;const total=2**(32-prefix);let usable,first,last;if(prefix===32){usable=1;first=last=ip}else if(prefix===31){usable=2;first=numToIp(network);last=numToIp(broadcast)}else{usable=Math.max(0,total-2);first=numToIp((network+1)>>>0);last=numToIp((broadcast-1)>>>0)}const rows=[['入力IP',ip+'/'+prefix],['ネットワークアドレス',numToIp(network)+'/'+prefix],['ブロードキャスト',numToIp(broadcast)],['サブネットマスク',numToIp(mask)],['ワイルドカードマスク',numToIp(wildcard)],['総アドレス数',total.toLocaleString()],['利用可能ホスト数',usable.toLocaleString()],['利用可能IP範囲',first+' ～ '+last]];$('results').innerHTML=rows.map(([k,v])=>`<div class="item copy" data-copy="${v}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');document.querySelectorAll('.copy').forEach(e=>e.onclick=async()=>{try{await navigator.clipboard.writeText(e.dataset.copy);const k=e.querySelector('.k');const old=k.textContent;k.innerHTML=old+'<span class="badge">コピーしました</span>';setTimeout(()=>k.textContent=old,900)}catch{}})}
$('calc').onclick=calculate;$('cidr').addEventListener('keydown',e=>{if(e.key==='Enter')calculate()});calculate();
</script></body></html>
